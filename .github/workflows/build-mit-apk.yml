name: Sagir Pro - Full Integrated Build
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-all-pro:
    runs-on: ubuntu-latest
    steps:
            - name: 1. Checkout All Features
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

            - name: 2. Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

            - name: 3. INTEGRATED PATCH - 300MB + Code Box + Fast Build
        run: |
          echo "=== SAGIR PRO INTEGRATED PATCH START ==="
          echo "Features: CODE BOX + Sagir Category + 300MB APK"
          # 300MB AIA Upload
          find appinventor -type f -name "*.java" -exec sed -i 's/30 \* 1024 \* 1024/300 * 1024 * 1024/g' {} \; || true
          find appinventor -type f -name "*.java" -exec sed -i 's/10 \* 1024 \* 1024/300 * 1024 * 1024/g' {} \; || true
          # 300MB Final APK (32MB -> 300MB)
          find appinventor -type f -name "*.java" -exec sed -i 's/31457280/314572800/g' {} \; || true
          find appinventor -type f -name "*.java" -exec sed -i 's/33554432/314572800/g' {} \; || true
          echo "=== All Patches Done - Building ==="
          ls appinventor/appengine/src/com/google/appinventor/client/ | grep -E "code-paste|blockly"

            - name: 4. Build MIT Pro Server (All Features Integrated)
        run: |
          cd appinventor
          ant MakeAuthKey
          ant -Dskip.tests=true

            - name: 5. Upload Final Integrated Pro
        uses: actions/upload-artifact@v4
        with:
          name: Sagir-Pro-FULL-INTEGRATED-300MB-CODEBOX
          path: |
            appinventor/build/
            appinventor/buildserver/build/
          retention-days: 30
